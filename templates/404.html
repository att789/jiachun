{% extends "layout.html" %}

{% block title %}404 - 页面未找到{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="text-center py-5">
            <div class="empty-state">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                <h1 class="display-1 text-warning mt-4">404</h1>
                <h3 class="text-light mt-3">页面未找到</h3>
                <p class="text-muted">抱歉，您访问的页面不存在</p>
                <a href="/" class="btn btn-warning btn-lg mt-4">
                    <i class="bi bi-house-door"></i> 返回首页
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
